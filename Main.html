<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-info {
            background: #4299e1;
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .view-container {
            min-height: 400px;
        }

        /* Form Styles */
        .form-container {
            background: #f7fafc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr {
            transition: background-color 0.3s ease;
        }

        tbody tr:hover {
            background-color: #f7fafc;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Details View */
        .details-card {
            background: #f7fafc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .details-card h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 2em;
        }

        .detail-row {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #2d3748;
            width: 150px;
        }

        .detail-value {
            color: #4a5568;
            flex: 1;
        }

        .grade-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.2em;
        }

        .grade-a { background: #48bb78; color: white; }
        .grade-b { background: #4299e1; color: white; }
        .grade-c { background: #ed8936; color: white; }
        .grade-d { background: #f56565; color: white; }
        .grade-f { background: #e53e3e; color: white; }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Student Result Management</h1>
            <p>Manage student records, sections, and results efficiently</p>
        </header>

        <div class="content">
            <div class="controls">
                <button class="btn-primary" onclick="app.loadStudents()">🔄 Load Students</button>
                <button class="btn-success" onclick="app.showAddForm()">➕ Add Student</button>
            </div>

            <div id="alertContainer"></div>

            <div class="view-container">
                <!-- List View -->
                <div id="listView">
                    <div class="table-container">
                        <table id="studentTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Section</th>
                                    <th>Marks</th>
                                    <th>Grade</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <tr>
                                    <td colspan="6" class="empty-state">
                                        <h3>No students loaded</h3>
                                        <p>Click "Load Students" to view all records</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Form View -->
                <div id="formView" class="hidden">
                    <div class="form-container">
                        <h2 id="formTitle">Add New Student</h2>
                        <form id="studentForm">
                            <div class="form-group">
                                <label for="studentName">Student Name *</label>
                                <input type="text" id="studentName" required placeholder="Enter student name">
                            </div>
                            <div class="form-group">
                                <label for="studentSection">Section *</label>
                                <select id="studentSection" required>
                                    <option value="">Select Section</option>
                                    <option value="A">Section A</option>
                                    <option value="B">Section B</option>
                                    <option value="C">Section C</option>
                                    <option value="D">Section D</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="studentMarks">Marks (0-100) *</label>
                                <input type="number" id="studentMarks" min="0" max="100" required placeholder="Enter marks">
                            </div>
                            <div class="form-group">
                                <label for="studentGrade">Grade *</label>
                                <select id="studentGrade" required>
                                    <option value="">Select Grade</option>
                                    <option value="A">A (90-100)</option>
                                    <option value="B">B (80-89)</option>
                                    <option value="C">C (70-79)</option>
                                    <option value="D">D (60-69)</option>
                                    <option value="F">F (Below 60)</option>
                                </select>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn-success">💾 Save Student</button>
                                <button type="button" class="btn-warning" onclick="app.showListView()">❌ Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Details View -->
                <div id="detailsView" class="hidden">
                    <div class="details-card">
                        <h2>Student Details</h2>
                        <div id="studentDetails"></div>
                        <div class="form-actions" style="margin-top: 30px;">
                            <button class="btn-primary" onclick="app.showListView()">← Back to List</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Classes
        class Student {
            constructor(id, name, section, marks, grade) {
                this.id = id;
                this.name = name;
                this.section = section;
                this.marks = marks;
                this.grade = grade;
            }
        }

        class Section {
            constructor(name, code) {
                this.name = name;
                this.code = code;
            }
        }

        class Result {
            constructor(studentId, marks, grade) {
                this.studentId = studentId;
                this.marks = marks;
                this.grade = grade;
                this.passStatus = marks >= 60 ? 'Pass' : 'Fail';
            }
        }

        // Service Layer
        class StudentService {
            constructor() {
                this.baseURL = 'http://localhost:3000';
            }

            async getAllStudents() {
                try {
                    const response = await fetch(`${this.baseURL}/students`);
                    if (!response.ok) throw new Error('Failed to fetch students');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching students:', error);
                    throw error;
                }
            }

            async getStudentById(id) {
                try {
                    const response = await fetch(`${this.baseURL}/students/${id}`);
                    if (!response.ok) throw new Error('Student not found');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching student:', error);
                    throw error;
                }
            }

            async createStudent(studentData) {
                try {
                    const response = await fetch(`${this.baseURL}/students`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(studentData)
                    });
                    if (!response.ok) throw new Error('Failed to create student');
                    return await response.json();
                } catch (error) {
                    console.error('Error creating student:', error);
                    throw error;
                }
            }

            async updateStudent(id, studentData) {
                try {
                    const response = await fetch(`${this.baseURL}/students/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(studentData)
                    });
                    if (!response.ok) throw new Error('Failed to update student');
                    return await response.json();
                } catch (error) {
                    console.error('Error updating student:', error);
                    throw error;
                }
            }

            async deleteStudent(id) {
                try {
                    const response = await fetch(`${this.baseURL}/students/${id}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('Failed to delete student');
                    return true;
                } catch (error) {
                    console.error('Error deleting student:', error);
                    throw error;
                }
            }
        }

        // Application
        class App {
            constructor() {
                this.studentService = new StudentService();
                this.students = [];
                this.currentStudent = null;
                this.isEditMode = false;
                this.init();
            }

            init() {
                const form = document.getElementById('studentForm');
                form.addEventListener('submit', (e) => this.handleFormSubmit(e));
                
                const marksInput = document.getElementById('studentMarks');
                marksInput.addEventListener('input', () => this.autoCalculateGrade());
            }

            autoCalculateGrade() {
                const marks = parseInt(document.getElementById('studentMarks').value);
                const gradeSelect = document.getElementById('studentGrade');
                
                if (marks >= 90) gradeSelect.value = 'A';
                else if (marks >= 80) gradeSelect.value = 'B';
                else if (marks >= 70) gradeSelect.value = 'C';
                else if (marks >= 60) gradeSelect.value = 'D';
                else if (marks >= 0) gradeSelect.value = 'F';
            }

            showAlert(message, type = 'success') {
                const alertContainer = document.getElementById('alertContainer');
                alertContainer.innerHTML = `
                    <div class="alert alert-${type}">
                        ${message}
                    </div>
                `;
                setTimeout(() => {
                    alertContainer.innerHTML = '';
                }, 3000);
            }

            async loadStudents() {
                try {
                    this.students = await this.studentService.getAllStudents();
                    this.renderStudentList();
                    this.showAlert(`Loaded ${this.students.length} students successfully!`);
                } catch (error) {
                    this.showAlert('Error loading students. Make sure JSON Server is running on port 3000.', 'error');
                }
            }

            renderStudentList() {
                const tbody = document.getElementById('studentTableBody');
                
                if (this.students.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty-state">
                                <h3>No students found</h3>
                                <p>Click "Add Student" to create a new record</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = this.students.map(student => `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.section}</td>
                        <td>${student.marks}</td>
                        <td><span class="grade-badge grade-${student.grade.toLowerCase()}">${student.grade}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-info btn-small" onclick="app.showDetails(${student.id})">👁️ View</button>
                                <button class="btn-warning btn-small" onclick="app.editStudent(${student.id})">✏️ Edit</button>
                                <button class="btn-danger btn-small" onclick="app.deleteStudent(${student.id})">🗑️ Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            showListView() {
                document.getElementById('listView').classList.remove('hidden');
                document.getElementById('formView').classList.add('hidden');
                document.getElementById('detailsView').classList.add('hidden');
            }

            showAddForm() {
                this.isEditMode = false;
                this.currentStudent = null;
                document.getElementById('formTitle').textContent = 'Add New Student';
                document.getElementById('studentForm').reset();
                document.getElementById('listView').classList.add('hidden');
                document.getElementById('formView').classList.remove('hidden');
                document.getElementById('detailsView').classList.add('hidden');
            }

            async editStudent(id) {
                try {
                    this.currentStudent = await this.studentService.getStudentById(id);
                    this.isEditMode = true;
                    
                    document.getElementById('formTitle').textContent = 'Edit Student';
                    document.getElementById('studentName').value = this.currentStudent.name;
                    document.getElementById('studentSection').value = this.currentStudent.section;
                    document.getElementById('studentMarks').value = this.currentStudent.marks;
                    document.getElementById('studentGrade').value = this.currentStudent.grade;
                    
                    document.getElementById('listView').classList.add('hidden');
                    document.getElementById('formView').classList.remove('hidden');
                    document.getElementById('detailsView').classList.add('hidden');
                } catch (error) {
                    this.showAlert('Error loading student details', 'error');
                }
            }

            async handleFormSubmit(e) {
                e.preventDefault();
                
                const studentData = {
                    name: document.getElementById('studentName').value,
                    section: document.getElementById('studentSection').value,
                    marks: parseInt(document.getElementById('studentMarks').value),
                    grade: document.getElementById('studentGrade').value
                };

                try {
                    if (this.isEditMode) {
                        await this.studentService.updateStudent(this.currentStudent.id, studentData);
                        this.showAlert('Student updated successfully!');
                    } else {
                        await this.studentService.createStudent(studentData);
                        this.showAlert('Student added successfully!');
                    }
                    
                    await this.loadStudents();
                    this.showListView();
                } catch (error) {
                    this.showAlert('Error saving student', 'error');
                }
            }

            async deleteStudent(id) {
                if (confirm('Are you sure you want to delete this student?')) {
                    try {
                        await this.studentService.deleteStudent(id);
                        this.showAlert('Student deleted successfully!');
                        await this.loadStudents();
                    } catch (error) {
                        this.showAlert('Error deleting student', 'error');
                    }
                }
            }

            async showDetails(id) {
                try {
                    const student = await this.studentService.getStudentById(id);
                    const result = new Result(student.id, student.marks, student.grade);
                    
                    const detailsHTML = `
                        <div class="detail-row">
                            <div class="detail-label">Student ID:</div>
                            <div class="detail-value">${student.id}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Name:</div>
                            <div class="detail-value">${student.name}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Section:</div>
                            <div class="detail-value">${student.section}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Marks:</div>
                            <div class="detail-value">${student.marks} / 100</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Grade:</div>
                            <div class="detail-value">
                                <span class="grade-badge grade-${student.grade.toLowerCase()}">${student.grade}</span>
                            </div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Status:</div>
                            <div class="detail-value">
                                <strong style="color: ${result.passStatus === 'Pass' ? '#48bb78' : '#f56565'}">
                                    ${result.passStatus}
                                </strong>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('studentDetails').innerHTML = detailsHTML;
                    document.getElementById('listView').classList.add('hidden');
                    document.getElementById('formView').classList.add('hidden');
                    document.getElementById('detailsView').classList.remove('hidden');
                } catch (error) {
                    this.showAlert('Error loading student details', 'error');
                }
            }
        }

        // Initialize App
        const app = new App();
    </script>
</body>
</html>
