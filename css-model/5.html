<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced Selectors</title>
  <link rel="stylesheet" href="5.css" />
</head>
<body>
  <main>
    <h1>Advanced CSS Selectors</h1>

    <form class="search" action="#">
      <input type="text" name="q" placeholder="Text input example" />
      <input type="url" name="link" placeholder="https://example.com" />
    </form>

    <ul class="items">
      <li data-role="first">Item 1 (first)</li>
      <li class="special">Item 2 (special)</li>
      <li>Item 3</li>
      <li><a href="https://example.com/page">External Link</a></li>
      <li><a href="/local">Local Link</a></li>
      <li class="after-demo">Item 6</li>
    </ul>
  </main>
</body>
</html>
