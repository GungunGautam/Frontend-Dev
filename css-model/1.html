<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Borders & Padding Demo</title>
  <link rel="stylesheet" href="1.css" />
</head>
<body>
  <header>
    <h1>Borders & Padding Demonstration</h1>
  </header>
  <main>
    <section class="boxes">
      <article class="box solid">
        <h2>Solid Border</h2>
        <p>Padding: 8px</p>
      </article>

      <article class="box dashed">
        <h2>Dashed Border</h2>
        <p>Padding: 16px</p>
      </article>

      <article class="box double rounded">
        <h2>Double + Rounded</h2>
        <p>Padding: 24px</p>
      </article>

      <article class="box groove rounded-lg">
        <h2>Groove + Large Radius</h2>
        <p>Padding: 40px</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Borders & Padding demo</p>
  </footer>
</body>
</html>
