<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transformations Showcase</title>
  <link rel="stylesheet" href="6.css" />
</head>
<body>
  <main>
    <h1>Transformations Showcase</h1>
    <section class="transform-row">
      <figure class="transform-item rotate">
        <div class="tile">Rotate</div>
        <figcaption>rotate()</figcaption>
      </figure>

      <figure class="transform-item scale">
        <div class="tile">Scale</div>
        <figcaption>scale()</figcaption>
      </figure>

      <figure class="transform-item translate">
        <div class="tile">Translate</div>
        <figcaption>translate()</figcaption>
      </figure>

      <figure class="transform-item skew">
        <div class="tile">Skew</div>
        <figcaption>skew()</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
