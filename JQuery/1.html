<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Welcome Page Greeting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #greeting {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #greeting:hover {
            transform: scale(1.05);
        }
        #welcomeMessage {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .time-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="greeting">Welcome!</h1>
        <div class="time-info">Current time will determine your greeting</div>
        
        <div id="welcomeMessage">
            <h3>Welcome to Our Website!</h3>
            <p>We're glad to have you here. Explore our features and enjoy your stay.</p>
        </div>
        
        <button id="changeGreeting">Change Greeting</button>
        <button id="toggleMessage">Toggle Welcome Message</button>
    </div>
    <script src="1.js"></script>
</body>
</html>
