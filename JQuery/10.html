<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        form { max-width: 400px; margin: 20px auto; padding: 20px; background: #f9f9f9; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 2px solid #ccc; }
        .error { border-color: red !important; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
        #message { padding: 10px; margin: 10px 0; border-radius: 5px; display: none; }
        .success { background: lightgreen; color: green; }
        .error-msg { background: lightcoral; color: red; }
        label { display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <form id="registrationForm">
        <h2>Registration Form</h2>
        
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
        
        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter password (min 8 chars)">
        
        <button type="submit">Register</button>
        
        <div id="message"></div>
    </form>

    <script src="10.js">
    </script>
</body>
</html>
