<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .manager { background: lightblue; padding: 10px; margin: 5px; cursor: pointer; }
        .employee { background: lightgray; padding: 8px; margin: 5px; }
        .contact { display: none; font-size: 0.9em; color: blue; }
        .department { border: 2px solid green; padding: 10px; margin: 10px; }
        .highlight { background: yellow; }
    </style>
</head>
<body>
    <div class="department" data-dept="Engineering">
        <div class="manager" data-role="manager">John (Manager)</div>
        <div class="employee" data-manager="John">Alice</div>
        <div class="contact">Contact: alice@company.com</div>
        <div class="employee" data-manager="John">Bob</div>
        <div class="contact">Contact: bob@company.com</div>
    </div>
    
    <button id="randomEmployee">Highlight Random Employee</button>
    <button id="collapseTeam">Collapse/Expand Team</button>

<script src="5.js"></script>
</body>
</html>
