<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="2.css">
</head>
<body class="bg-light text-dark">

  <header class="text-center mt-4">
    <h1 class="fw-bold">Gungun Gautam</h1>
    <p class="lead">Web Developer | Designer | Dreamer</p>
  </header>

  <main class="container text-center mt-4">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" alt="Profile" class="img-fluid rounded-circle mb-3">
    <div>
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-secondary">Download CV</button>
    </div>

    <form class="mt-5">
      <input type="text" class="form-control mb-3" placeholder="Your Name">
      <input type="email" class="form-control mb-3" placeholder="Your Email">
      <textarea class="form-control mb-3" rows="3" placeholder="Your Message"></textarea>
      <button class="btn btn-success">Send</button>
    </form>
  </main>

</body>
</html>
