<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
    }
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }
    .card-img-top {
      height: 250px;
      object-fit: cover;
    }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      transition: transform 0.2s ease;
    }
    .btn-primary:hover {
      transform: scale(1.05);
    }
    .card-title {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="text-white text-center py-5">
    <h1 class="display-4 fw-bold">Life & Code</h1>
    <p class="lead">Thoughts, stories, and tutorials</p>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow">
          <img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?w=600&h=300&fit=crop" class="card-img-top" alt="Minimalist workspace">
          <div class="card-body">
            <h5 class="card-title text-primary">The Art of Simplicity</h5>
            <p class="card-text text-muted">Exploring the beauty of minimal design in the digital world.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow">
          <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&h=300&fit=crop" class="card-img-top" alt="Team collaboration">
          <div class="card-body">
            <h5 class="card-title text-primary">Building with Passion</h5>
            <p class="card-text text-muted">A glimpse into how enthusiasm shapes creativity.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 bg-light mt-5">
    <small class="text-muted">&copy; 2025 Life & Code Blog</small>
  </footer>

</body>
</html>
