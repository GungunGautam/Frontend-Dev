<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="4.css">
</head>
<body>

  <main class="container py-5">
    <h2 class="text-center mb-4">Today's Menu</h2>

    <!-- Menu Table -->
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Category</th>
          <th>Dish</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Starters</td><td>Tomato Soup</td><td>$5</td></tr>
        <tr><td>Main Course</td><td>Grilled Chicken</td><td>$15</td></tr>
        <tr><td>Dessert</td><td>Chocolate Cake</td><td>$6</td></tr>
      </tbody>
    </table>

    <!-- Chef's Specials -->
    <section class="my-5">
      <h4>Chef’s Specials</h4>
      <ul class="list-group">
        <li class="list-group-item">Pasta Alfredo</li>
        <li class="list-group-item">Paneer Butter Masala</li>
        <li class="list-group-item">Tiramisu</li>
      </ul>
    </section>

    <!-- Image -->
    <div class="text-center">
      <img src="https://via.placeholder.com/500x300" class="img-fluid rounded" alt="Food Image">
      <p class="lead mt-2">Delicious meals made fresh daily</p>
    </div>
  </main>

</body>
</html>
