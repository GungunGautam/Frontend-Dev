<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card-img-top {
      height: 250px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <main class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row g-4">
      <!-- Product Card 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop" class="card-img-top" alt="Wireless Headphones">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text text-muted mb-2">Premium sound quality</p>
            <p class="card-text fw-bold fs-5">$20</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop" class="card-img-top" alt="Smart Watch">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text text-muted mb-2">Track your fitness</p>
            <p class="card-text fw-bold fs-5">$25</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400&h=400&fit=crop" class="card-img-top" alt="Camera">
          <div class="card-body text-center">
            <h5 class="card-title">Digital Camera</h5>
            <p class="card-text text-muted mb-2">Capture every moment</p>
            <p class="card-text fw-bold fs-5">$18</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=400&fit=crop" class="card-img-top" alt="Sunglasses">
          <div class="card-body text-center">
            <h5 class="card-title">Designer Sunglasses</h5>
            <p class="card-text text-muted mb-2">UV protection</p>
            <p class="card-text fw-bold fs-5">$22</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
