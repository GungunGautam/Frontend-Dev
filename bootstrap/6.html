<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="6.css">
</head>
<body>

  <main class="container my-5">
    <h2 class="text-center mb-4">User Notifications</h2>

    <!-- Card grouping alerts -->
    <div class="card p-4">
      <!-- Success Alert -->
      <div class="alert alert-success" role="alert">
        ✅ New message received successfully!
      </div>

      <!-- Info Alert -->
      <div class="alert alert-info" role="alert">
        ℹ️ Tip: Update your profile for better recommendations.
      </div>

      <!-- Danger Alert -->
      <div class="alert alert-danger" role="alert">
        ⚠️ Warning: Password expires in 3 days!
      </div>

      <!-- Dismissible Alert -->
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        ⏰ Reminder: Complete your pending tasks today!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>

    <!-- Summary Well -->
    <section class="bg-light border rounded p-4 mt-4">
      <h5>Summary</h5>
      <p class="mb-0">You have 3 new notifications and 2 pending tasks.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
