<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .carousel-item img {
      height: 500px;
      object-fit: cover;
      border-radius: 15px;
    }
    .carousel-caption {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .carousel-caption h5 {
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .carousel-caption p {
      font-size: 1.2rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    .progress {
      height: 30px;
      border-radius: 15px;
      background-color: #e9ecef;
    }
    .progress-bar {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      font-size: 1.1rem;
      font-weight: bold;
    }
    h2 {
      color: #333;
      font-weight: bold;
    }
    h4 {
      color: #555;
      font-weight: 600;
    }
    footer {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .carousel {
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 15px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Carousel Section -->
  <main class="container my-5">
    <h2 class="text-center mb-4">Explore the World</h2>

    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1200&h=600&fit=crop" class="d-block w-100 img-fluid" alt="Paris Eiffel Tower">
          <div class="carousel-caption">
            <h5>Paris</h5>
            <p>The City of Lights awaits you.</p>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1200&h=600&fit=crop" class="d-block w-100 img-fluid" alt="Bali Beach">
          <div class="carousel-caption">
            <h5>Bali</h5>
            <p>Relax in tropical paradise.</p>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=1200&h=600&fit=crop" class="d-block w-100 img-fluid" alt="New York Skyline">
          <div class="carousel-caption">
            <h5>New York</h5>
            <p>The city that never sleeps.</p>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Progress Bar -->
    <section class="mt-5">
      <h4>Booking Progress</h4>
      <div class="progress mt-3">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%">70% Complete</div>
      </div>
    </section>
  </main>

  <footer class="text-white text-center py-4">
    <p class="mb-0">📧 travel@exploreworld.com | 📞 +91 99999 99999</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
