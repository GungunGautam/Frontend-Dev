<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="8.css">
</head>
<body>

  <main class="container py-5">
    <h2 class="text-center mb-4">Choose Your Plan</h2>

    <div class="row g-4">
      <!-- Basic Plan -->
      <div class="col-md-4">
        <div class="card text-center h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Basic</h5>
            <p class="display-6">$9</p>
            <ul class="list-unstyled mb-3">
              <li>✔ 5 Projects</li>
              <li>✔ Email Support</li>
              <li>❌ Analytics</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Select</a>
          </div>
        </div>
      </div>

      <!-- Pro Plan -->
      <div class="col-md-4">
        <div class="card text-center h-100 bg-primary text-white shadow-lg">
          <div class="card-body">
            <h5 class="card-title">Pro</h5>
            <p class="display-6">$19</p>
            <ul class="list-unstyled mb-3">
              <li>✔ 20 Projects</li>
              <li>✔ Priority Support</li>
              <li>✔ Analytics</li>
            </ul>
            <a href="#" class="btn btn-light">Select</a>
          </div>
        </div>
      </div>

      <!-- Enterprise Plan -->
      <div class="col-md-4">
        <div class="card text-center h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Enterprise</h5>
            <p class="display-6">$29</p>
            <ul class="list-unstyled mb-3">
              <li>✔ Unlimited Projects</li>
              <li>✔ 24/7 Support</li>
              <li>✔ Custom Reports</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Select</a>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
