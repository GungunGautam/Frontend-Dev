<!DOCTYPE html>
<html>
<head>
    <title>Conference Schedule</title>
</head>
<body>

    <header>
        <h1>Annual Tech Conference 2025</h1>
    </header>

    <main>
        <table border="1" cellpadding="8">
            <caption>Conference Schedule</caption>
            <thead>
                <tr>
                    <th>Session</th>
                    <th>Time</th>
                    <th>Topic</th>
                    <th>Speaker</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Morning</td>
                    <td>9:00 AM - 11:00 AM</td>
                    <td>Future of AI</td>
                    <td>Dr. Mehta</td>
                </tr>
                <tr>
                    <td>Afternoon</td>
                    <td>1:00 PM - 3:00 PM</td>
                    <td>Cybersecurity Trends</td>
                    <td>Ms. Rao</td>
                </tr>
                <tr>
                    <td>Evening</td>
                    <td>4:00 PM - 6:00 PM</td>
                    <td>Cloud Computing Innovations</td>
                    <td>Mr. Khan</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" align="center"><strong>End of Day - Networking Dinner at 7:00 PM</strong></td>
                </tr>
            </tfoot>
        </table>
    </main>

</body>
</html>
