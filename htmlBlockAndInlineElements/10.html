<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Choose Your Travel Preferences</h1>

    <label>Country:</label>
    <select>
        <option selected>India</option>
        <option>France</option>
        <option>Japan</option>
    </select><br><br>

    <label>State:</label>
    <select>
        <option selected>Uttar Pradesh</option>
        <option>Maharashtra</option>
        <option>Delhi</option>
    </select><br><br>

    <label>City:</label>
    <select>
        <option selected>Lucknow</option>
        <option>Agra</option>
        <option>Delhi</option>
    </select><br><br>

    <label>Favorite Tourist Place:</label>
    <select>
        <option selected>Taj Mahal</option>
        <option>Eiffel Tower</option>
        <option>Mount Fuji</option>
    </select><br><br>

    <p>You have selected: <strong>India → Uttar Pradesh → Lucknow → Taj Mahal</strong></p>

</body>
</html>
