<!DOCTYPE html>
<html>
<head>
  <title>Complete Head Example</title>
  <!-- Sets character encoding -->
  <meta charset="UTF-8">
  <!-- Provides a short description of the page -->
  <meta name="description" content="HTML head tag demonstration">
  <!-- Author information -->
  <meta name="author" content="Gungun Gautam">
  <!-- Sets base URL for relative links -->
  <base href="https://example.com/">
  <!-- Links to favicon -->
  <link rel="icon" href="favicon.ico">
  <!-- Empty style section -->
  <style></style>
  <!-- Empty script tag -->
  <script></script>
</head>
<body>
  <p>This page demonstrates all major head elements.</p>
</body>
</html>
