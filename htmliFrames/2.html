<!DOCTYPE html>
<html>
<head>
  <title>Google Map</title>
</head>
<body>
  <h1>My City Map</h1>
  <!-- loading="lazy" delays loading of the iframe until it's visible, improving performance -->
  <iframe src="https://www.google.com/maps/embed?pb=!1m18..."
          title="Map of My City"
          width="80%"
          height="400"
          loading="lazy">
  </iframe>
</body>
</html>
