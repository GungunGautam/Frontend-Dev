<!DOCTYPE html>
<html>
<head>
  <title>URI Encoding</title>
</head>
<body>
  <p>Original URL: https://example.com/search?query=HTML & CSS</p>
  <p>Encoded URL: https://example.com/search?query=HTML%20%26%20CSS</p>
  <a href="https://example.com/search?query=HTML%20%26%20CSS">Visit Search Page</a>
</body>
</html>
