<!DOCTYPE html>
<html>
<head>
  <title>Form Security</title>
</head>
<body>
  <form autocomplete="off">
    Username: <input type="text" required><br><br>
    Password: <input type="password" required><br><br>
    <input type="submit" value="Login">
  </form>
  <p>Turning off autocomplete prevents browsers from storing login credentials, improving security.</p>
</body>
</html>
