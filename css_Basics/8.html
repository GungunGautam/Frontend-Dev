<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple Dashboard</title>
<style>
  :root{
    --header-h:64px;
    --sidebar-w:240px;
    --bg:#f5f7fb;
    --accent:#0b5cff;
    --card-shadow: 0 10px 30px rgba(16,24,40,0.06);
  }
  html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);}

  /* Fixed header */
  header{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--header-h);
    background:#ffffff;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid rgba(12,20,40,0.06);
    z-index:40;
    box-shadow: 0 4px 10px rgba(16,24,40,0.03);
  }
  header .brand{font-weight:700;color:var(--accent);}

  /* layout container below header */
  .layout{
    display:flex;
    gap:20px;
    padding-top: calc(var(--header-h) + 20px);
    min-height: calc(100vh - var(--header-h));
  }

  /* sidebar */
  aside{
    width:var(--sidebar-w);
    background:#fff;
    border-right:1px solid rgba(12,20,40,0.04);
    padding:18px;
    height: calc(100vh - var(--header-h));
    position:sticky;
    top:var(--header-h);
    box-shadow: var(--card-shadow);
    overflow:auto;
  }
  nav a{
    display:block;
    padding:10px 12px;
    border-radius:8px;
    color:#0f1724;
    text-decoration:none;
    margin-bottom:8px;
    font-weight:600;
  }
  nav a:hover{ background:rgba(11,92,255,0.06); color:var(--accent); }

  /* main content */
  main{
    flex:1;
    padding:18px;
  }

  .grid{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }

  .box{
    background:#fff;
    padding:18px;
    flex:1 1 320px;
    min-height:160px;
    border-radius:12px;
    box-shadow:var(--card-shadow);
  }

  /* make sidebar stack above content on small screens */
  @media (max-width:880px){
    .layout{flex-direction:column;padding-top: calc(var(--header-h) + 12px);}
    aside{ width:100%; height:auto; position:relative; top:0;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Dashboard</div>
  </header>

  <div class="layout">
    <aside aria-label="Sidebar navigation">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Teams</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main>
      <section class="grid">
        <div class="box">
          <h2>Activity</h2>
          <p>Recent activity feed and quick stats go here.</p>
        </div>

        <div class="box">
          <h2>Performance</h2>
          <p>Charts and KPIs would be placed here (placeholder).</p>
        </div>
      </section>

      <section style="margin-top:18px" class="grid">
        <div class="box">
          <h3>Tasks</h3>
          <p>Task summary and next steps.</p>
        </div>
        <div class="box">
          <h3>Messages</h3>
          <p>Messages, notifications and quick replies.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
