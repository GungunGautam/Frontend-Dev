<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact Page</title>
<style>
  :root{
    --bg:#f0f7fb;
    --card:#ffffff;
    --accent:#0b5cff;
    --muted:#6b7280;
    --shadow: 0 6px 18px rgba(11,20,60,0.08);
  }
  html,body{height:100%;margin:0;font-family: system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#111;}
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .contact-card{
    width:100%;
    max-width:680px;
    background:var(--card);
    border-radius:12px;
    padding:28px;
    box-shadow:var(--shadow);
    border:1px solid rgba(12,20,40,0.04);
  }

  h1{margin:0 0 12px 0;font-size:20px;color:var(--accent);}
  p.lead{margin:0 0 18px 0;color:var(--muted);}

  form {display:flex;flex-direction:column;gap:12px;}

  label{font-size:13px;color:var(--muted)}
  input[type="text"],
  input[type="email"],
  input[type="text"].subject,
  textarea{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(12,20,40,0.08);
    box-shadow: 0 4px 12px rgba(12,20,40,0.04);
    outline: none;
    font-size:14px;
    transition: border-color 160ms ease, box-shadow 160ms ease;
    resize:vertical;
  }

  /* focus state */
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(11,92,255,0.12);
  }

  textarea{min-height:140px;padding-top:10px;}

  .row{display:flex;gap:12px;}
  .row .col{flex:1;}

  button{
    background:var(--accent);
    color:#fff;
    padding:12px 16px;
    border-radius:10px;
    border:0;
    cursor:pointer;
    font-weight:600;
    margin-top:6px;
    box-shadow: 0 8px 20px rgba(11,92,255,0.12);
  }

  /* small devices alignment test (no tables) */
  @media (max-width:560px){
    .row{flex-direction:column;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <section class="contact-card" aria-labelledby="contactTitle">
      <h1 id="contactTitle">Contact Us</h1>
      <p class="lead">Questions or feedback? Send us a message and we'll get back soon.</p>

      <form action="#" method="post" novalidate>
        <div class="row">
          <div class="col">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>
          <div class="col">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div>
          <label for="subject">Subject</label>
          <input id="subject" name="subject" class="subject" type="text" placeholder="Subject" />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
        </div>

        <div>
          <button type="submit">Send Message</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
