    <style>
      /* Navbar background identical to Bootstrap Docs */
      .bd-navbar {
        background-color: #712cf9;
        background-image: linear-gradient(180deg, #712cf9, #5a1be3);
      }
      .navbar {
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        font-weight: 600;
        color: #fff;
      }
      .navbar-brand svg {
        margin-right: .35rem;
      }
      .nav-link {
        color: rgba(255,255,255,.85);
        font-weight: 500;
        margin-right: .75rem;
      }
      .nav-link:hover {
        color: #fff;
      }

      /* Search box */
      .bd-search {
        position: relative;
      }
      .bd-search input {
        background-color: rgba(255,255,255,.15);
        border: 1px solid rgba(255,255,255,.25);
        color: #fff;
        border-radius: .375rem;
        padding-left: 2rem;
        padding-right: 3.5rem;
        height: 2.2rem;
      }
      .bd-search input::placeholder {
        color: rgba(255,255,255,.65);
      }
      .bd-search .bi-search {
        position: absolute;
        top: 50%;
        left: .75rem;
        transform: translateY(-50%);
        color: rgba(255,255,255,.65);
      }
      .kbd-shortcut {
        position: absolute;
        right: .5rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: .7rem;
        background-color: rgba(255,255,255,.15);
        border: 1px solid rgba(255,255,255,.25);
        color: #fff;
        padding: 1px 5px;
        border-radius: .25rem;
      }

      /* Icons on right */
      .navbar-icons a {
        color: white;
        margin-left: .75rem;
        font-size: 1.25rem;
      }
      .navbar-icons a:hover {
        color: #e0dff5;
      }

      .dropdown-toggle {
        color: white;
        font-weight: 500;
      }

      .navbar-dark .navbar-toggler {
        border-color: rgba(255,255,255,.2);
      }
    </style>
</head>
