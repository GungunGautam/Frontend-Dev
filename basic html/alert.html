<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Scrollbar with Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ================= Scrollbar Styles ================= */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #222;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #6610f2, #0d6efd);
      border-radius: 10px;
      animation: colorShift 3s infinite alternate;
    }

    @keyframes colorShift {
      0% { background: linear-gradient(180deg, #6610f2, #0d6efd); }
      100% { background: linear-gradient(180deg, #0dcaf0, #6f42c1); }
    }

    /* Smooth scrolling effect */
    html {
      scroll-behavior: smooth;
    }

    /* ================= Navbar & Page Styles ================= */
    .navbar {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
    }

    .name {
      color: white;
      margin: 5px;
      margin-left: 10px;
      font-weight: 600;
    }

    .breadcrumb-item a {
      color: #bbb;
      text-decoration: none;
    }

    .breadcrumb-item.active {
      color: #f8f9fa;
    }

    .main {
      height: 1500px; /* make page scrollable */
      background: #000;
      padding: 20px;
    }

    .main p {
      color: burlywood;
      font-size: 30px;
      font-weight: 900;
      padding: 10px;
    }

    .card {
      height: 550px;
      padding: 20px;
    }

    .card-title {
      margin: 20px;
    }

  
  </style>
</head>

<body>
  <div class="box">
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
      <div class="name">Gungun Gautam</div>

      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Library</a></li>
        <li class="breadcrumb-item active" aria-current="page">Data</li>
      </ol>

      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Library</a></li>
        <li class="breadcrumb-item active" aria-current="page">Data</li>
      </ol>
    </nav>

    <div class="main">
      <p>Skills & Expertise</p>

      <div class="row">
        <div class="col-sm-6 mb-3 mb-sm-0 fade-in">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Java</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
              </div>

              <h5 class="card-title">HTML</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 85%"></div>
              </div>

              <h5 class="card-title">CSS</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 80%"></div>
              </div>

              <h5 class="card-title">Bootstrap</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 90%"></div>
              </div>

              <h5 class="card-title">JavaScript</h5>
              <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 70%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 fade-in">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">React</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 65%"></div>
              </div>

              <h5 class="card-title">Node.js</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%"></div>
              </div>

              <h5 class="card-title">MongoDB</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 60%"></div>
              </div>

              <h5 class="card-title">Express</h5>
              <div class="progress mb-3">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 80%"></div>
              </div>

              <h5 class="card-title">Git & GitHub</h5>
              <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 75%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Fade-in Animation on Scroll -->
  
</body>
</html>
