<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="3.css">
</head>
<body>
  <header>
    <h1>Image Showcase Layout</h1>
  </header>

  <main>
    <section class="gallery">
      <figure>
        <img src="https://picsum.photos/300/200?1" alt="Sample Image 1">
        <figcaption>Peaceful Nature</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/300/200?2" alt="Sample Image 2">
        <figcaption>Beautiful Landscape</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/300/200?3" alt="Sample Image 3">
        <figcaption>Golden Sunset</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/300/200?4" alt="Sample Image 4">
        <figcaption>City Lights</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/300/200?5" alt="Sample Image 5">
        <figcaption>Mountain View</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/300/200?6" alt="Sample Image 6">
        <figcaption>Ocean Horizon</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Hover over images to see the effect.</p>
  </footer>
</body>
</html>
