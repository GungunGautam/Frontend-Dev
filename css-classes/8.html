<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title>
  <link rel="stylesheet" href="8.css">
</head>
<body>
  <header><h1>Box-Sizing Comparison</h1></header>

  <main class="box-container">
    <div class="box default-box">
      <p>Default (content-box)</p>
    </div>
    <div class="box border-box">
      <p>With box-sizing: border-box;</p>
    </div>
  </main>

  <footer><p>Note how both boxes have same width but different total size.</p></footer>
</body>
</html>
