<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>
  <header><h1>CSS Tooltip Demonstration</h1></header>

  <main class="tooltip-container">
    <div class="tooltip">
      ℹ️
      <span class="tooltip-text">This is an info tooltip</span>
    </div>
    <div class="tooltip">
      ❤️
      <span class="tooltip-text">Like this item</span>
    </div>
    <div class="tooltip">
      💬
      <span class="tooltip-text">Chat with us</span>
    </div>
  </main>

  <footer><p>Hover over icons to see tooltips.</p></footer>
</body>
</html>
