<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q8 - Custom Dropdown</title>
  <link rel="stylesheet" href="8.css">
</head>
<body>

<h2>Custom Dropdown</h2>

<div id="dropdown" class="dropdown">
  <button id="dropBtn">Select Option</button>
  <ul id="options" class="options" hidden>
    <li data-value="HTML">HTML</li>
    <li data-value="CSS">CSS</li>
    <li data-value="JavaScript">JavaScript</li>
  </ul>
</div>

<script src="8.js"></script>
</body>
</html>
