<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q3 - Multi-Step Form</title>
  <link rel="stylesheet" href="3.css" />
</head>
<body>
  <main>
    <h1>3-Step Form</h1>
    <form id="multiStepForm" novalidate>
      <section class="step" data-step="1">
        <label>
          Name:
          <input name="name" id="nameInput" required />
        </label>
        <div class="nav">
          <button type="button" class="next-btn">Next</button>
        </div>
      </section>

      <section class="step" data-step="2" hidden>
        <label>
          Email:
          <input name="email" id="emailInput" type="email" required />
        </label>
        <div class="nav">
          <button type="button" class="back-btn">Back</button>
          <button type="button" class="next-btn">Next</button>
        </div>
      </section>

      <section class="step" data-step="3" hidden>
        <label>
          Password:
          <input name="password" id="passwordInput" type="password" minlength="6" required />
        </label>
        <div class="nav">
          <button type="button" class="back-btn">Back</button>
          <button type="submit" class="submit-btn">Submit</button>
        </div>
      </section>
    </form>

    <div id="summary" hidden>
      <h2>Summary</h2>
      <pre id="summaryContent"></pre>
      <button id="editAllBtn">Edit</button>
    </div>
  </main>

  <script src="3.js"></script>
</body>
</html>
