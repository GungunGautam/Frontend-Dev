<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q2 - Live Character Counter</title>
  <link rel="stylesheet" href="2.css" />
</head>
<body>
  <main>
    <h1>Live Character Counter (max 100)</h1>
    <textarea id="messageBox" rows="6" placeholder="Type here..."></textarea>
    <div class="status">
      <span id="remaining">100</span> characters remaining
    </div>
    <button id="resetBtn">Reset</button>
  </main>

  <script src="2.js"></script>
</body>
</html>
